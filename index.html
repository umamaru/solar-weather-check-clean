<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>栽培判断用 気象データビューア</title>
    <link rel="stylesheet" href="style.css" />
    <script>window.BUILD_SHA = "da7a5be";</script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>栽培判断用 気象データビューア</h1>
        <p id="buildInfo" class="build-info">build: v0.1.6 / -</p>
      </header>

      <section class="panel controls">
        <label for="prefectureSelect">都道府県</label>
        <div class="controls-row">
          <select id="prefectureSelect" aria-label="都道府県を選択"></select>
          <button id="loadButton" type="button">データ更新</button>
        </div>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section id="summaryCards" class="cards" hidden>
        <article class="card"><h2>選択地点</h2><p id="selectedLocation">-</p></article>
      </section>

      <section id="chartSection" class="panel" hidden>
        <h2>直近1ヶ月の日射量・平均気温グラフ</h2>
        <div class="chart-wrap"><canvas id="dailyChart"></canvas></div>
      </section>

      <section id="tableSection" class="panel" hidden>
        <h2>日別データ</h2>
        <div class="table-wrap">
          <table class="daily-table">
            <thead>
              <tr>
                <th>日付</th><th>天気</th><th>日射量</th><th>最高気温</th><th>最低気温</th><th>平均気温</th>
              </tr>
            </thead>
            <tbody id="dataTableBody"></tbody>
          </table>
        </div>
        <p id="dailyLoading" class="status" hidden>読み込み中…</p>
        <p id="dailyEnd" class="status" hidden>これ以上表示できるデータはありません</p>
      </section>

      <section id="futureCompareSection" class="panel" hidden>
        <h2>今後1ヶ月の過去年日射量</h2>
        <div class="series-toggle" id="seriesToggle" aria-label="比較グラフの表示切替">
          <label><input type="checkbox" id="toggleLastYear" checked />前年</label>
          <label><input type="checkbox" id="toggleTwoYears" checked />前々年</label>
          <label><input type="checkbox" id="toggleRawSeries" />日別データ</label>
        </div>
        <div class="chart-wrap"><canvas id="compareChart"></canvas></div>
        <p id="compareError" class="status error" hidden>過去年データを取得できませんでした</p>
      </section>

      <section id="yearDiffSection" class="panel" hidden>
        <h2>日射量前年差比較（今後1ヶ月の目安）</h2>
        <div class="controls-row month-nav">
          <button id="prevMonth" type="button">前の1ヶ月</button>
          <button id="nextMonth" type="button">次の1ヶ月</button>
        </div>
        <div class="chart-wrap"><canvas id="yearDiffChart"></canvas></div>
        <p id="yearDiffError" class="status error" hidden>データ取得不可</p>
      </section>
    </main>
  </body>
</html>
